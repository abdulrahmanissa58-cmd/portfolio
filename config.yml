backend:
  name: git-gateway
  branch: main

media_folder: "images/projects"
public_folder: "/images/projects"

collections:
  - name: "projects"
    label: "المشاريع"
    folder: "_projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "العنوان", name: "title", widget: "string" }
      - { label: "الوصف", name: "desc", widget: "text" }
      - { label: "القسم", name: "category", widget: "select", options: ["data", "graphic", "ai", "auto"] }
      - { label: "الأيموجي", name: "emoji", widget: "string", default: "📊" }
      - { label: "الصورة", name: "cover", widget: "image", required: false }
      - { label: "الأدوات", name: "tags", widget: "list", default: [] }
